<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Gearlift</title>
<meta name="description" content="Your workout, built from the gear you have. Free on Google Play.">
<meta property="og:title" content="Gearlift — free home &amp; gym workout planner">
<meta property="og:description" content="Pick your equipment and muscles, get a real workout. Free, no ads, no account needed.">
<meta property="og:image" content="https://nunomarques97.github.io/gearlift-legal/get/icon.png">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #212020; --card: #2B2830; --lime: #E2F163; --ink: #232323; --text: #FFFFFF; --muted: #A8A4B3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  .icon { width: 112px; height: 112px; border-radius: 26px; display: block; margin: 0 auto 24px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 40px rgba(226,241,99,0.18); }
  h1 { font-size: 30px; line-height: 1.1; font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; margin: 0 0 12px; }
  h1 span { color: var(--lime); }
  p { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 0 28px; }
  .cta { display: block; width: 100%; padding: 18px 20px; border-radius: 16px; background: var(--lime); color: var(--ink); font-size: 18px; font-weight: 800; text-decoration: none; text-transform: uppercase; letter-spacing: 0.02em; }
  .cta:active { transform: scale(0.98); }
  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 28px; padding: 0; list-style: none; }
  .pills li { background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--text); }
  .alt { display: inline-block; margin-top: 18px; color: var(--muted); font-size: 14px; }
  .note { margin-top: 28px; font-size: 13px; color: var(--muted); }
  .note a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Gearlift app icon" width="112" height="112">
  <h1>Your workout, built from <span>your gear</span></h1>
  <p>Pick your equipment and the muscles you want to train. Gearlift builds a real workout and guides you set by set.</p>
  <ul class="pills">
    <li>Free</li><li>No ads</li><li>No account needed</li><li>Android</li>
  </ul>
  <a class="cta" id="get" href="https://play.google.com/store/apps/details?id=com.gearlift.app&amp;utm_source=instagram&amp;utm_medium=social&amp;utm_content=bio_page">Get it on Google Play</a>
  <a class="alt" id="alt" href="market://details?id=com.gearlift.app">Button not working? Open the Play Store app</a>
  <div class="note"><a href="../">Privacy policy &amp; terms</a></div>
</main>
</body>
</html>
